<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1426">
  <meta name="description" content="种下一颗小小的种子，收获一株只属于这个瞬间的花。一个无需服务器的生成艺术小实验。">
  <title>一颗种子 · A Seed — GPT Playground</title>
  <link rel="stylesheet" href="./seed.css">
</head>
<body>
  <div class="app-shell">
    <header class="site-header"><a href="../" class="back-link" aria-label="返回 GPT Playground 首页"><span aria-hidden="true">←</span> gpt/playground</a><span class="issue">EXPERIMENT 001 / A SEED</span></header>
    <main>
      <section class="intro">
        <div class="tiny-label"><span class="label-star">✳</span> A GENERATIVE LITTLE THING</div>
        <h1>一颗<span>种子</span><small>A Seed</small></h1>
        <p>把一点偶然，种进夜色。<br>每次生长，都会有些不同。</p>
      </section>
      <section class="garden-frame" aria-label="植物生长的夜间花园">
        <div class="garden-meta"><span>THE MIDNIGHT GARDEN</span><span id="specimen">SPECIMEN / —</span></div>
        <svg id="garden" viewBox="0 0 720 475" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="夜色中一株由随机种子生成的开花植物。点击土地可以重新选择种植位置。">
          <defs>
            <radialGradient id="sky" cx="48%" cy="34%" r="82%"><stop stop-color="#254c78"/><stop offset=".58" stop-color="#152d50"/><stop offset="1" stop-color="#0b1d39"/></radialGradient>
            <radialGradient id="moonlight"><stop stop-color="#c6deff" stop-opacity=".37"/><stop offset="1" stop-color="#c6deff" stop-opacity="0"/></radialGradient>
            <linearGradient id="earth" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#172e3c"/><stop offset="1" stop-color="#0b1b29"/></linearGradient>
          </defs>
          <rect width="720" height="475" fill="url(#sky)"/>
          <circle cx="506" cy="111" r="112" fill="url(#moonlight)"/>
          <circle cx="506" cy="111" r="49" fill="#d3e5eb" opacity=".87"/>
          <circle cx="486" cy="91" r="50" fill="#f0f4f3" opacity=".15"/>
          <g class="stars" fill="#cce8f9">
            <circle cx="64" cy="66" r="1.4"/><circle cx="135" cy="129" r="1.8"/><circle cx="217" cy="52" r="1.1"/>
            <circle cx="333" cy="99" r="1.2"/><circle cx="420" cy="47" r="1.5"/><circle cx="628" cy="70" r="1.4"/>
            <circle cx="660" cy="185" r="1.2"/><circle cx="82" cy="203" r="1.1"/><circle cx="264" cy="159" r=".8"/>
            <path d="M154 79v12M148 85h12M594 198v10M589 203h10" fill="none" stroke="#cce8f9" stroke-width="1.1" opacity=".65"/>
          </g>
          <path d="M0 340 Q75 325 150 337 T300 342 T460 333 T720 340V475H0Z" fill="url(#earth)"/>
          <path d="M0 340 Q75 325 150 337 T300 342 T460 333 T720 340" fill="none" stroke="#607e77" stroke-width="1.3" opacity=".48"/>
          <g id="plant-layer"></g>
          <g fill="#68857c" opacity=".7"><path d="M87 353l-5-12m5 12 8-9M628 348l-4-10m4 10 6-12M567 360l3-9" stroke="#6b9086" stroke-width="1.5"/></g>
          <rect id="soil-hit" x="0" y="215" width="720" height="260" fill="transparent" role="button" tabindex="0" aria-label="在这里种下一颗种子"/>
        </svg>
        <div class="garden-caption"><span class="caption-symbol">✧</span><span id="plant-message" aria-live="polite">每一种生长，都有自己的方向。</span><span class="caption-symbol">✧</span></div>
      </section>
      <div class="bottom-panel">
        <div class="seed-data"><span class="data-label">YOUR LITTLE SEED</span><span id="seed-code" class="code-value">—</span><span id="palette-name" class="palette">—</span></div>
        <div class="actions"><button id="plant-button" class="plant-button" type="button">再种一颗 <span aria-hidden="true">✳</span></button><button id="share-button" class="share-button" type="button">分享这株植物 <span aria-hidden="true">↗</span></button></div>
      </div>
      <p class="hint" id="action-status" aria-live="polite">也可以点击画面中的土地，选择它生长的位置。</p>
    </main>
    <footer><span>Growing with randomness, not urgency.</span><a href="https://github.com/VMoonLightV/gpt-playground" rel="noopener noreferrer">Open source on GitHub ↗</a></footer>
  </div>
  <script type="module" src="./seed.js"></script>
</body>
</html>
